version: "3.8"
services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      - MONGO_CONN_STRING=mongodb://mongodb:27017/typeracerDB
      - PORT=3001
      - CLIENT_ORIGIN=http://localhost:3000
    depends_on:
      - mongodb
    command: npm start

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_SOCKET_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  mongo-data:
